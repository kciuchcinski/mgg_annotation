# Test configuration — uses the bundled test/data/ genomes and a local
# databases/ directory.  Run with:
#
#   nextflow run main.nf -profile <apptainer|docker|conda> -params-file test/config.yml

# ==========================================
# BASIC CONFIGURATION
# ==========================================

PHAGES_DIR: test/data
INPUT_EXTENSION: fasta
OUTPUT_DIR: test/output
DB_ROOT: databases
PHAGE_MIN_LENGTH: 2000
WRITE_SEARCH_TABLE: true
WRITE_ANNOTATION_TABLE: true
N_FUNCTIONS_PER_DB: 2

# ==========================================
# ADVANCED CONFIGURATION
# ==========================================

ANNOTATION_FILTERS:
  PHROGS:
    MIN_PROB: 0.7
    MIN_QCOV: 0.1
    MIN_TCOV: 0.1
  DOMAIN_DBS:   # ECOD, PFAM
    MIN_PROB: 0.7
    MIN_QCOV: 0.1
    MIN_TCOV: 0.1

CLUSTERING:
  IDENTITY: 0.5
  COVERAGE: 0.8
  EVAL: 0.001
  SENSITIVITY: 7.5

BATCH_SIZE: 20
THREADS_PER_BATCH: 4
SEARCH_TOOL: "hhblits_omp"
ENRICH_CPUS: 4
PARSING_CPUS: 16
