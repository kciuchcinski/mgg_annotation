# Conda environment (Linux only: glimmer has no macOS / linux-aarch64 build).
# On macOS use Docker instead (see README).
name: phage_annotation
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - biopython=1.79
  - pandas=3.0.2
  - numpy=2.4.4
  - hhsuite=3.3.0
  - mmseqs2=16.747c6
  - glimmer=3.02
  - prodigal-gv=2.11.0
  - pip
  - pip:
      - csb==1.2.5
