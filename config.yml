# ==========================================
# BASIC CONFIGURATION
# ==========================================

# Input directory containing phage fasta files
PHAGES_DIR: test/data

# File extension for input files
INPUT_EXTENSION: fasta

# Output directory for all results
OUTPUT_DIR: output_test

# Database root directory (use absolute path)
DB_ROOT: /home/karol/krk_pipeline/mgg_annotation/databases

# Minimum length for phages (bp)
PHAGE_MIN_LENGTH: 2000

# Enable to save the full raw hits table (search.tsv) to OUTPUT_DIR
WRITE_SEARCH_TABLE: true

# Enable to save the per-ORF annotation table (annotation.tsv) to OUTPUT_DIR
WRITE_ANNOTATION_TABLE: true

# ==========================================
# ADVANCED CONFIGURATION
# ==========================================

# --- Annotation Filtering Thresholds ---
ANNOTATION_FILTERS:
  PHROGS:
    MIN_PROB: 0.7
    MIN_QCOV: 0.1
    MIN_TCOV: 0.1
  DOMAIN_DBS:   # ECOD, ALANDB, PFAM
    MIN_PROB: 0.7
    MIN_QCOV: 0.1
    MIN_TCOV: 0.1

# --- Clustering Parameters ---
CLUSTERING:
  IDENTITY: 0.5
  COVERAGE: 0.8
  EVAL: 0.001
  SENSITIVITY: 7.5

# --- Execution & Batching ---
BATCH_SIZE: 20
THREADS_PER_BATCH: 24
SEARCH_TOOL: "hhblits_omp"