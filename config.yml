# ==========================================
# BASIC CONFIGURATION
# ==========================================

# Input directory containing phage fasta files
PHAGES_DIR: test/data

# File extension for input files
INPUT_EXTENSION: fasta

# Output directory for all results
OUTPUT_DIR: output_test

# Database root directory (use absolute path)
# NOTE: You can also set per-db overrides in the DATABASES section below
DB_ROOT: /Users/karol/projects/mgg_annotation/databases

# Minimum length for phages (bp)
PHAGE_MIN_LENGTH: 2000

# Enable to save the full raw hits table (search.tsv) to OUTPUT_DIR
WRITE_SEARCH_TABLE: true

# Enable to save the per-ORF annotation table (annotation.tsv) to OUTPUT_DIR
WRITE_ANNOTATION_TABLE: true

# Set how many functions per protein per database should be reported. We recommend 2.
N_FUNCTIONS_PER_DB: 2

# ==========================================
# DATABASES
# Default paths to databases are derived from DB_ROOT
# You can uncomment the entries below to override specific database paths
# ==========================================

# # Path to glimmer training file (usually .icm)
# GLIMMER_TRAIN: "/Users/karol/MGG Dropbox/Databases/Glimmer/training-file_refseq.icm"

# # Paths to HHSuite databases. They should contain the .ffdata and .ffindex files
# HHSUITE:
#   PHROGS: "/path/to/hhsuite_db/phrogs"
#   PFAM: "/path/to/hhsuite_db/pfam"
#   ECOD: "/path/to/hhsuite_db/ecod"
#   ALANDB: "/Users/karol/MGG Dropbox/Databases/AlanDavidson/profile-db/profiles"

# # Paths to metadata annotation tables. Those should point to specific csv/tsv files
# METADATA:
#   PHROGS_TABLE: "/path/to/metadata/phrog_annot_v4.tsv"
#   ALAN_TABLE: "/path/to/metadata/alan_annot.tsv"

# ==========================================
# ADVANCED CONFIGURATION
# ==========================================

# --- Annotation Filtering Thresholds ---
ANNOTATION_FILTERS:
  PHROGS:
    MIN_PROB: 0.7
    MIN_QCOV: 0.1
    MIN_TCOV: 0.1
  DOMAIN_DBS:   # ECOD, ALANDB, PFAM
    MIN_PROB: 0.7
    MIN_QCOV: 0.1
    MIN_TCOV: 0.1

# --- Clustering Parameters ---
CLUSTERING:
  IDENTITY: 0.5
  COVERAGE: 0.8
  EVAL: 0.001
  SENSITIVITY: 7.5

# --- Execution & Batching ---
BATCH_SIZE: 20
THREADS_PER_BATCH: 4
SEARCH_TOOL: "hhblits_omp"
